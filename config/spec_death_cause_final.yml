dataset_id: death_cause_final
table_name: death_cause_final
primary_key: [year_id, location_id, sex_id, age, cause_concept_id]

required_columns:
  year_id: integer
  location_id: integer
  sex_id: integer
  age: integer
  cause_concept_id: integer
  deaths_observed: numeric
  deaths_post_redistribution: numeric
  deaths_final: numeric
  correction_factor_completeness: numeric
  pandemic_excess_component: numeric
  run_id: character

constraints:
  year_id: {allow_na: false, min: 2018, max: 2024}
  location_id: {allow_na: false}
  sex_id: {allow_na: false, allowed_values: [8507, 8532]}
  age: {allow_na: false, min: 0, max: 110}
  cause_concept_id: {allow_na: false}
  deaths_observed: {allow_na: false, min: 0}
  deaths_post_redistribution: {allow_na: false, min: 0}
  deaths_final: {allow_na: false, min: 0}
  correction_factor_completeness: {allow_na: false, min: 1.0, max: 3.0}
  pandemic_excess_component: {allow_na: false, min: 0}
  run_id: {allow_na: false}

dictionary:
  year_id: {label: "Año analítico"}
  location_id: {label: "Departamento analítico"}
  sex_id: {label: "Sexo OMOP-like"}
  age: {label: "Edad simple"}
  cause_concept_id: {label: "Identificador OMOP-like de causa"}
  deaths_observed: {label: "Muertes observadas en la tabla de entrada de este script; en el MVP actual equivale a deaths_post_redistribution y no a defunciones crudas pre-06"}
  deaths_post_redistribution: {label: "Muertes tras redistribución de garbage codes del script 06"}
  deaths_final: {label: "Muertes finales tras corrección de completitud y suma de componente pandémico"}
  correction_factor_completeness: {label: "Factor de completitud all-cause aplicado a la celda edad-sexo-región-año"}
  pandemic_excess_component: {label: "Componente de exceso pandémico asignado a la causa en la celda"}
  run_id: {label: "Identificador de corrida"}
